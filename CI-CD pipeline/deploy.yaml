name: Deploy to Server

on:
  push:
    branches:
      - main

#  this file also needs some image to run right
jobs:  
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: SSH to server and deploy
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_IP }} # server ip need to create in secrets of the repo
          username: ${{ secrets.SERVER_USER }} # server user
          key: ${{ secrets.SSH_PRIVATE_KEY }} # ssh private key
          script: |
            cd /path/to/your/app
            git pull
            docker-compose up -d --build
